<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commute Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f6f7f4; --ink:#1d2a2a; --muted:#6b7776; --line:#dde2df; --accent:#0f6b63; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141b1b; --ink:#e7eeec; --muted:#93a19f; --line:#2a3535; --accent:#4cc3b5; }
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; font:14px/1.4 Inter, system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    #app { display:grid; grid-template-columns:320px 1fr; height:100%; }
    aside { padding:20px; overflow:auto; border-right:1px solid var(--line); }
    h1 { font:700 22px 'Bricolage Grotesque', sans-serif; margin:0 0 16px; }
    h2 { font:500 15px 'Bricolage Grotesque', sans-serif; margin:22px 0 8px; }
    input[type=text], input[type=number], select { width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
    .row input[type=text] { flex:1 1 0%; }
    .row button { flex:0 0 auto; }
    button { padding:8px 12px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .row label { flex:1; display:flex; gap:8px; align-items:center; }
    .swatch { width:12px; height:12px; border-radius:50%; }
    .row input[type=number] { width:64px; }
    #status { color:var(--muted); margin-top:12px; min-height:2.8em; }
    #map { height:100%; }
    @media (max-width:720px) { #app { grid-template-columns:1fr; grid-template-rows:auto 60vh; } aside { border:0; } }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Commute Map</h1>
      <div class="row"><input id="addr" type="text" placeholder="Enter a US address" aria-label="Address" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" /><button id="go" type="button">Search</button></div>
      <h2>Travel time (minutes)</h2>
      <div id="modes"></div>
      <h2>Listings</h2>
      <div class="row"><label><input id="listOn" type="checkbox" /> Show listings inside the area</label></div>
      <div class="row"><select id="kind"><option value="rent">For rent</option><option value="sale">For sale</option></select></div>
      <div class="row"><input id="maxPrice" type="number" placeholder="Max price" aria-label="Max price" /><input id="minBeds" type="number" placeholder="Min beds" aria-label="Min beds" /></div>
      <div id="status" role="status"></div>
    </aside>
    <div id="map"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
